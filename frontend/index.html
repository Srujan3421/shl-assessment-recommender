<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SHL Assessment Recommender</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #152032;
        --muted: #617084;
        --line: #d8e0ea;
        --blue: #1857a4;
        --green: #0d7a5f;
        --bg: #f6f8fb;
        --panel: #ffffff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      header {
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      .wrap {
        width: min(1120px, calc(100vw - 32px));
        margin: 0 auto;
      }
      header .wrap {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 72px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        letter-spacing: 0;
      }
      .status {
        color: var(--green);
        font-size: 14px;
        font-weight: 700;
      }
      main.wrap {
        display: grid;
        grid-template-columns: 1fr 380px;
        gap: 20px;
        padding: 24px 0;
      }
      section {
        min-width: 0;
      }
      .chat,
      .results {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      .messages {
        height: 560px;
        overflow: auto;
        padding: 18px;
      }
      .message {
        margin: 0 0 14px;
        display: grid;
        gap: 6px;
      }
      .role {
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }
      .bubble {
        width: fit-content;
        max-width: 86%;
        padding: 11px 13px;
        border-radius: 8px;
        line-height: 1.45;
        white-space: pre-wrap;
      }
      .user .bubble {
        margin-left: auto;
        background: #e8f0fb;
      }
      .assistant .bubble {
        background: #f1f4f7;
      }
      form {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        border-top: 1px solid var(--line);
        padding: 14px;
      }
      textarea {
        min-height: 48px;
        max-height: 120px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        font: inherit;
      }
      button {
        border: 0;
        border-radius: 8px;
        background: var(--blue);
        color: white;
        font: inherit;
        font-weight: 800;
        padding: 0 18px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.55;
        cursor: wait;
      }
      .results {
        padding: 16px;
      }
      .results h2 {
        margin: 0 0 12px;
        font-size: 17px;
      }
      .item {
        border-top: 1px solid var(--line);
        padding: 12px 0;
      }
      .item:first-of-type {
        border-top: 0;
      }
      .item a {
        color: var(--blue);
        font-weight: 800;
        text-decoration: none;
      }
      .type {
        color: var(--muted);
        font-size: 13px;
        margin-top: 4px;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      .pill {
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        font-size: 12px;
        padding: 3px 8px;
      }
      @media (max-width: 860px) {
        main.wrap {
          grid-template-columns: 1fr;
        }
        .messages {
          height: 460px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap">
        <h1>SHL Assessment Recommender</h1>
        <div class="status" id="status">checking</div>
      </div>
    </header>
    <main class="wrap">
      <section class="chat">
        <div class="messages" id="messages"></div>
        <form id="form">
          <textarea id="input" placeholder="Describe the role, skills, or refinement..." required></textarea>
          <button id="send" type="submit">Send</button>
        </form>
      </section>
      <aside class="results">
        <h2>Shortlist</h2>
        <div id="results"></div>
      </aside>
    </main>
    <script>
      const messagesEl = document.querySelector("#messages");
      const resultsEl = document.querySelector("#results");
      const form = document.querySelector("#form");
      const input = document.querySelector("#input");
      const send = document.querySelector("#send");
      const status = document.querySelector("#status");
      const history = [
        {
          role: "assistant",
          content:
            "Tell me the role, seniority, core skills, and whether you want technical, aptitude, personality, simulation, or mixed assessments.",
        },
      ];

      function renderMessages() {
        messagesEl.innerHTML = history
          .map(
            (message) => `
              <div class="message ${message.role}">
                <div class="role">${message.role}</div>
                <div class="bubble">${escapeHtml(message.content)}</div>
              </div>
            `
          )
          .join("");
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function renderResults(items) {
        if (!items.length) {
          resultsEl.innerHTML = '<p class="type">No committed recommendations yet.</p>';
          return;
        }
        resultsEl.innerHTML = items
          .map(
            (item) => `
              <div class="item">
                <a href="${item.url}" target="_blank" rel="noreferrer">${escapeHtml(item.name)}</a>
                <div class="type">Test type: ${escapeHtml(item.test_type)}</div>
                <div class="meta">
                  ${item.duration ? `<span class="pill">${escapeHtml(item.duration)}</span>` : ""}
                  ${item.remote !== undefined ? `<span class="pill">Remote: ${item.remote ? "yes" : "no"}</span>` : ""}
                  ${item.adaptive !== undefined ? `<span class="pill">Adaptive: ${item.adaptive ? "yes" : "no"}</span>` : ""}
                </div>
              </div>
            `
          )
          .join("");
      }

      function escapeHtml(value) {
        return value.replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;",
        }[char]));
      }

      async function checkHealth() {
        const response = await fetch("/health");
        status.textContent = response.ok ? "healthy" : "unavailable";
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const content = input.value.trim();
        if (!content) return;
        history.push({ role: "user", content });
        input.value = "";
        renderMessages();
        send.disabled = true;
        try {
          const response = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages: history.filter((message) => message.role !== "system") }),
          });
          const data = await response.json();
          history.push({ role: "assistant", content: data.reply });
          renderResults(data.recommendations || []);
        } catch (error) {
          history.push({ role: "assistant", content: "Request failed. Check that the API server is running." });
        } finally {
          send.disabled = false;
          renderMessages();
        }
      });

      renderMessages();
      renderResults([]);
      checkHealth().catch(() => {
        status.textContent = "unavailable";
      });
    </script>
  </body>
</html>
